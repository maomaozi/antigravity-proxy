<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground · Antigravity Console</title>
    <script>
        try {
            const preference = localStorage.theme || 'system';
            document.documentElement.classList.toggle('dark', preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
        } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/playground.css">
    <script type="module" src="js/playground.js?v=5"></script>
</head>
<body class="min-h-full lg:h-full flex flex-col bg-zinc-50 dark:bg-black text-zinc-900 dark:text-zinc-200 font-mono text-xs transition-colors lg:overflow-hidden">
    <header class="sticky top-0 z-40 h-14 shrink-0 bg-white dark:bg-black border-b border-zinc-200 dark:border-zinc-800">
        <div class="h-full px-4 sm:px-6 flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 min-w-0">
                <a href="/frontend/index.html" class="flex shrink-0 items-center justify-center w-8 h-8 rounded border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 font-bold text-lg hover:border-emerald-500/50" aria-label="Back to accounts">A</a>
                <h1 class="text-sm font-bold text-zinc-900 dark:text-white">Playground</h1>
            </div>
            <nav class="flex items-center gap-2 sm:gap-4" aria-label="Navigation">
                <button id="theme" type="button" class="p-1.5 w-8 h-8 flex items-center justify-center rounded text-zinc-500 hover:text-zinc-900 dark:hover:text-white" title="Change theme" aria-label="Change theme">
                    <svg id="icon-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <svg id="icon-moon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 008.354-5.646z"/></svg>
                    <svg id="icon-system" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                </button>
                <a href="/frontend/usage.html" class="hidden sm:inline text-[10px] font-bold uppercase tracking-wider text-zinc-500 hover:text-emerald-600 dark:hover:text-emerald-400">Usage</a>
                <a href="/frontend/sessions.html" class="hidden sm:inline text-[10px] font-bold uppercase tracking-wider text-zinc-500 hover:text-emerald-600 dark:hover:text-emerald-400">Sessions</a>
                <a href="/frontend/index.html" class="px-2.5 py-1.5 rounded border border-zinc-200 dark:border-zinc-800 text-[10px] font-bold uppercase tracking-wider text-zinc-500 hover:text-emerald-600 dark:hover:text-emerald-400">Accounts</a>
            </nav>
        </div>
    </header>
    <main class="flex flex-col lg:flex-row lg:flex-1 min-h-0 w-full max-w-[1800px] mx-auto">
        <aside class="lg:w-80 lg:shrink-0 lg:overflow-y-auto p-4 sm:p-6 bg-white dark:bg-[#0a0a0a] border-b lg:border-b-0 lg:border-r border-zinc-200 dark:border-zinc-800">
            <label for="mode">Mode</label><select id="mode"><option value="chat">Chat</option><option value="image">Images</option></select>
            <label for="model-select">Model</label><select id="model-select" aria-label="Select model"><option value="">Loading…</option></select>
            <div id="model-custom" hidden><label for="model">Custom model</label><input id="model" placeholder="Model ID" autocomplete="off"></div>
            <button id="reload" type="button" class="subtle">Refresh</button>
            <p id="model-status" class="muted" role="status" hidden></p>
            <label for="effort">Reasoning</label><select id="effort"><option value="">Default</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select>
            <div id="chat-options"><label for="instructions">Instructions</label><textarea id="instructions" rows="4" placeholder="Optional"></textarea></div>
            <div id="image-options" hidden>
                <label for="size">Image size</label><select id="size"><option>512</option><option selected>1K</option><option>2K</option><option>4K</option></select>
                <label for="ratio">Aspect ratio</label><select id="ratio"><option>1:1</option><option>1:4</option><option>4:1</option><option>1:8</option><option>8:1</option><option>2:3</option><option>3:2</option><option>3:4</option><option>4:3</option><option>4:5</option><option>5:4</option><option>9:16</option><option>16:9</option><option>21:9</option></select>
            </div>
            <button id="clear" type="button" class="mt-6 w-full">New chat</button>
        </aside>
        <section class="workspace flex flex-col flex-1 min-h-0 min-w-0 bg-zinc-50 dark:bg-black" aria-label="Conversation">
            <div class="workspace-heading"><strong id="heading" class="uppercase tracking-wider">Chat</strong><span id="status" role="status">Ready</span></div>
            <div id="messages" role="log" aria-label="Conversation"></div>
            <form id="composer">
                <div id="attachments" aria-label="Attachments"></div>
                <label class="sr-only" for="prompt">Message</label><textarea id="prompt" rows="3" placeholder="Message"></textarea>
                <p id="error" role="alert" hidden></p>
                <div class="actions"><label id="upload" for="files" class="upload-button" tabindex="0">+ Attach</label><input id="files" class="file-input" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif,.txt,.md,.csv,.json,.jsonl,.log,.xml,.yaml,.yml,.html,.css,.js,.ts,.tsx,.jsx,.py,.go,.rs,.java,.c,.cpp,.h,.sh,.sql"><span class="spacer"></span><button id="stop" type="button" hidden>Stop</button><button id="send" class="primary" type="submit">Send</button></div>
            </form>
        </section>
    </main>
</body>
</html>
