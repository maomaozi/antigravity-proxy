<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型 Playground · Antigravity Console</title>
    <link rel="stylesheet" href="css/playground.css">
    <script type="module" src="js/playground.js"></script>
</head>
<body>
    <header><a class="brand" href="/frontend/index.html">A <span>Antigravity Proxy</span></a><nav aria-label="导航"><a href="/frontend/index.html">控制台</a><a href="/frontend/usage.html">用量</a><button id="theme" type="button">切换主题</button></nav></header>
    <main>
        <aside>
            <p class="eyebrow">PLAYGROUND</p><h1>模型实验室</h1><p class="muted">对话、理解图片，或将想法变成画面。</p>
            <label for="mode">工作模式</label><select id="mode"><option value="chat">多轮聊天</option><option value="image">图片生成</option></select>
            <label for="model">模型</label><input id="model" list="models" placeholder="选择或输入模型 ID" autocomplete="off"><datalist id="models"></datalist>
            <button id="reload" type="button" class="subtle">刷新模型列表</button>
            <p id="model-status" class="muted" role="status"></p>
            <label for="effort">思考强度</label><select id="effort"><option value="">模型默认</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select>
            <div id="chat-options"><label for="instructions">系统提示词（可选）</label><textarea id="instructions" rows="4" placeholder="例如：请用中文简洁回答。"></textarea></div>
            <div id="image-options" hidden>
                <label for="size">图片尺寸</label><select id="size"><option>512</option><option selected>1K</option><option>2K</option><option>4K</option></select>
                <label for="ratio">宽高比</label><select id="ratio"><option>1:1</option><option>1:4</option><option>4:1</option><option>1:8</option><option>8:1</option><option>2:3</option><option>3:2</option><option>3:4</option><option>4:3</option><option>4:5</option><option>5:4</option><option>9:16</option><option>16:9</option><option>21:9</option></select>
                <p class="muted">图片模型使用上游模型 ID，例如 gemini-3.1-flash-image。尺寸、比例和思考强度以模型支持情况为准。现有接口仅支持文字生图，不接收参考图片。</p>
            </div>
            <button id="clear" type="button">新建会话</button><p class="muted">会话仅保留在当前页面，刷新即清空。</p>
        </aside>
        <section class="workspace" aria-label="聊天与生成结果">
            <div class="workspace-heading"><strong id="heading">多轮聊天</strong><span id="status" role="status">就绪</span></div>
            <div id="messages" role="log" aria-label="会话记录"><div id="empty"><span class="spark">✦</span><h2>从一个想法开始</h2><p>选择模型，输入问题或上传图片与文本文件。</p></div></div>
            <form id="composer">
                <div id="attachments" aria-label="待发送附件"></div>
                <label class="sr-only" for="prompt">消息或图片描述</label><textarea id="prompt" rows="3" placeholder="输入消息… Enter 发送，Shift + Enter 换行"></textarea>
                <p id="error" role="alert" hidden></p>
                <div class="actions"><button id="upload" type="button">＋ 添加附件</button><input id="files" type="file" multiple hidden accept="image/png,image/jpeg,image/webp,image/gif,.txt,.md,.csv,.json,.jsonl,.log,.xml,.yaml,.yml,.html,.css,.js,.ts,.tsx,.jsx,.py,.go,.rs,.java,.c,.cpp,.h,.sh,.sql"><span class="spacer"></span><button id="stop" type="button" hidden>停止</button><button id="send" class="primary" type="submit">发送</button></div>
                <p id="file-hint" class="muted">支持 PNG / JPEG / WebP / GIF 和 UTF-8 文本、代码文件；最多 8 个，总计 10 MB。文本文件会作为消息正文发送，图片理解取决于模型能力。</p>
            </form>
        </section>
    </main>
</body>
</html>
